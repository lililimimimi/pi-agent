[project]
name = "code-assistant-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "sse-starlette>=2.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Required: always install dev deps for this project
# Run: pip install -e ".[dev]"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# loguru formats messages with "{}"; pylint's logging rule reads them as stdlib logging and misfires
ignore = ["PLE1205"]
# C901: cyclomatic complexity, kept at 10 per function
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
